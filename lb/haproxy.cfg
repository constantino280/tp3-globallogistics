global
    maxconn 20000

defaults
    mode http
    option httplog
    option http-keep-alive
    # Si la conexión a una réplica falla, reintenta en otra en lugar de devolver error.
    option redispatch
    retries 2
    timeout connect 2s
    timeout client  60s
    timeout server  30s
    # Tiempo máximo de espera en la cola del balanceador: pasado este límite responde 503.
    timeout queue   30s
    timeout check   1s

# DNS interno de Docker: resuelve el nombre del servicio "api" a las IP de sus réplicas.
resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 2s
    accepted_payload_size 8192

frontend http_in
    bind :8080
    # La inyección de fallas no se expone a los clientes.
    http-request deny deny_status 403 if { path_beg /chaos }
    default_backend cotizador

backend cotizador
    balance roundrobin
    http-reuse safe

    # Health check ACTIVO: sondea /health de cada réplica cada 2 s.
    # 3 fallos seguidos la sacan de rotación; 2 aciertos seguidos la reincorporan.
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    default-server check inter 2s fall 3 rise 2 maxconn 32 resolvers docker init-addr libc,none

    # Descubrimiento server-side: las réplicas se toman del DNS, sin IP fijas.
    # Las 10 ranuras permiten escalar con "--scale api=N" sin tocar esta configuración;
    # con 3 réplicas, las 7 restantes quedan inactivas (MAINT) y no reciben tráfico.
    server-template api- 10 api:8080

listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s
    stats show-legends
